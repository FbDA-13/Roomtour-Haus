<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050506">
  <title>360°-Roomtour | Haus Fine</title>
  <link rel="stylesheet" href="style.css?v=5-toggle">
</head>
<body>
  <main id="app">
    <div id="pano"></div>

    <div id="loader">
      <div class="spinner"></div>
      <span>Panorama wird geladen …</span>
    </div>

    <a id="customerBrand"
       href="https://www.haus-fine.at"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Website von Haus Fine öffnen">
      <img src="assets/haus-fine-logo.png" alt="Haus Fine">
    </a>

    <a id="creatorBrand"
       href="https://www.framesbyambrusch.at"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Website von Frames by Daniel Ambrusch öffnen">
      <img src="assets/frames-by-ambrusch-logo.png"
           alt="Frames by Daniel Ambrusch">
    </a>

    <div id="sceneTitle"></div>

    <div id="controls">
      <button id="autorotate" aria-label="Automatische Drehung">▶</button>
      <button id="zoomOut" aria-label="Verkleinern">−</button>
      <button id="zoomIn" aria-label="Vergrößern">+</button>
      <button id="fullscreen" aria-label="Vollbild">⛶</button>
    </div>


    <button id="filmstripToggle"
            type="button"
            aria-expanded="true"
            aria-controls="filmstripWrap"
            title="Bildervorschau ausblenden"
            aria-label="Bildervorschau ausblenden">⌄</button>

    <nav id="filmstripWrap">
      <button class="stripArrow" id="stripPrev">‹</button>
      <div id="filmstrip"></div>
      <button class="stripArrow" id="stripNext">›</button>
    </nav>
  </main>

  <script src="vendor/screenfull.min.js"></script>
  <script src="vendor/marzipano.js"></script>
  <script src="tour-data.js?v=5-toggle"></script>
  <script src="app.js?v=5-toggle"></script>
</body>
</html>
